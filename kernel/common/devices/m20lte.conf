# Samsung Galaxy M20 (m20lte) -- Exynos 7904 (S5E7904). XNU/iOS bring-up target.
NAME="Samsung Galaxy M20 (m20lte)"
KIND=phone
SOC="Samsung Exynos 7904 (S5E7904)"

UEFI_TARGET=m20lte
FD_BASE=0x8F000000
FD_SIZE=0x200000
# The BootShim copies XNUP here; this is inside the FD's unused tail and must
# match loader.c's PAYLOAD_BASE and uefi/BootManagerLib/XnuLoader.h.
PAYLOAD_BASE=0x8F100000
PAYLOAD_MAX=0x80000
FB_BASE=0xEC000000

WIFI_ATH11K=0
GIC_V2=1

BOOTARGS="cpus=8 bootcpu=auto"
DEFAULT_SECS=900
USERLAND_VARS=""
FIRMWARE=""
